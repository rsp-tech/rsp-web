<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Surabhi Gomata Body -->
  <ellipse cx="56" cy="54" rx="26" ry="18" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1.2"/>
  <!-- Hump on shoulder (Vedic Zebu hump) -->
  <path d="M42 42 C40 32, 48 30, 52 38 Z" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1.2"/>

  <!-- Neck and Head -->
  <path d="M38 48 Q32 38 28 32 Q22 28 20 34 Q18 42 24 48 Q30 52 38 52 Z" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1.2"/>

  <!-- Horns with Golden Tips -->
  <path d="M26 30 C25 20, 20 16, 18 14 C17 18, 21 24, 23 28 Z" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>
  <path d="M30 28 C31 18, 36 14, 38 12 C37 17, 34 23, 31 27 Z" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>

  <!-- Ears -->
  <ellipse cx="20" cy="34" rx="5" ry="2" transform="rotate(-25 20 34)" fill="#FED7AA" stroke="#B45309" stroke-width="0.8"/>
  <ellipse cx="32" cy="32" rx="5" ry="2" transform="rotate(25 32 32)" fill="#FED7AA" stroke="#B45309" stroke-width="0.8"/>

  <!-- Tilak on forehead -->
  <path d="M25 26 L25 31" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Peaceful Eye -->
  <ellipse cx="23" cy="34" rx="2" ry="1.2" fill="#451A03"/>

  <!-- Marigold Flower Garland around Neck -->
  <path d="M28 42 Q32 50 36 46" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Golden Bell on collar -->
  <ellipse cx="34" cy="49" rx="2.5" ry="3.5" fill="#F59E0B" stroke="#78350F" stroke-width="0.8"/>

  <!-- Legs -->
  <rect x="36" y="66" width="4" height="24" rx="2" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1"/>
  <rect x="44" y="64" width="4" height="24" rx="2" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1"/>
  <rect x="66" y="66" width="4" height="24" rx="2" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1"/>
  <rect x="74" y="64" width="4" height="24" rx="2" fill="url(#cowGrad)" stroke="#B45309" stroke-width="1"/>
  <!-- Hooves -->
  <rect x="36" y="88" width="4" height="3" fill="#78350F"/>
  <rect x="44" y="86" width="4" height="3" fill="#78350F"/>
  <rect x="66" y="88" width="4" height="3" fill="#78350F"/>
  <rect x="74" y="86" width="4" height="3" fill="#78350F"/>

  <!-- Tail with brush tuft -->
  <path d="M80 50 Q86 64 84 76" stroke="#B45309" stroke-width="1.5" fill="none"/>
  <ellipse cx="84" cy="78" rx="2.5" ry="4" fill="#78350F"/>
</svg>
