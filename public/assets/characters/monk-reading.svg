<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="50" cy="24" r="14" fill="#FEF08A" opacity="0.3"/>

  <!-- Head gently looking down at scripture -->
  <g transform="rotate(8 50 24)">
    <circle cx="50" cy="24" r="8" fill="url(#skinGrad)" stroke="#C2410C" stroke-width="1"/>
    <!-- Shikha -->
    <path d="M45 18 Q40 16 42 22 Q46 20 45 18 Z" fill="#78350F"/>
    <!-- Tilak -->
    <path d="M50 20 L50 25 M49 22 L51 22" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eyeline -->
    <path d="M49 26 Q51 28 53 26" stroke="#9A3412" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Seated Padmasana posture -->
  <!-- Torso -->
  <path d="M38 34 L62 34 L65 60 L35 60 Z" fill="url(#saffronGrad)" stroke="#C2410C" stroke-width="1"/>

  <!-- Arms reaching forward to hold scripture -->
  <path d="M38 38 Q32 50 42 56" stroke="#EA580C" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M62 38 Q68 50 58 56" stroke="#EA580C" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Wooden Book Stand (Rehal / Vyasasana) -->
  <path d="M35 78 L50 64 L65 78 M42 72 L58 72" stroke="url(#woodGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Open Sacred Scripture (Bhagavad-gita) -->
  <path d="M34 60 C38 56, 48 57, 50 63 C52 57, 62 56, 66 60 L64 68 C60 64, 52 65, 50 70 C48 65, 40 64, 36 68 Z" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
  <!-- Text lines in book -->
  <line x1="38" y1="62" x2="48" y2="62" stroke="#B45309" stroke-width="0.7"/>
  <line x1="38" y1="65" x2="47" y2="65" stroke="#B45309" stroke-width="0.7"/>
  <line x1="52" y1="62" x2="62" y2="62" stroke="#B45309" stroke-width="0.7"/>
  <line x1="53" y1="65" x2="62" y2="65" stroke="#B45309" stroke-width="0.7"/>

  <!-- Crossed Legs (Padmasana) -->
  <path d="M22 84 C22 70, 36 60, 50 66 C64 60, 78 70, 78 84 C76 90, 24 90, 22 84 Z" fill="url(#saffronGrad)" stroke="#C2410C" stroke-width="1"/>
  <ellipse cx="26" cy="82" rx="4" ry="2.5" fill="url(#skinGrad)"/>
  <ellipse cx="74" cy="82" rx="4" ry="2.5" fill="url(#skinGrad)"/>
</svg>
