<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
  <defs>
    <linearGradient id="hareGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="hareGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C2D12" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="152" height="42" rx="21" fill="#7C2D12" fill-opacity="0.85" stroke="url(#hareGold)" stroke-width="2" filter="url(#hareGlow)"/>

  <text x="80" y="27" font-family="'Cinzel', 'Noto Serif', serif, Georgia" font-size="14" font-weight="bold" fill="url(#hareGold)" text-anchor="middle" letter-spacing="1">
    हरे कृष्ण
  </text>
  <text x="80" y="38" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1.5">
    HARE KRISHNA
  </text>
</svg>
