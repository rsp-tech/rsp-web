<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" fill="none">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="stickerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#78350F" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Glowing background pill / ribbon badge -->
  <rect x="4" y="4" width="132" height="52" rx="26" fill="#78350F" fill-opacity="0.85" stroke="url(#goldText)" stroke-width="2" filter="url(#stickerGlow)"/>

  <!-- Small Corner Flutes / Lotus accents -->
  <circle cx="20" cy="30" r="6" fill="#F59E0B" opacity="0.3"/>
  <circle cx="120" cy="30" r="6" fill="#F59E0B" opacity="0.3"/>

  <!-- Ornate Calligraphic Text "Radhe Radhe" -->
  <text x="70" y="36" font-family="'Cinzel', 'Noto Serif', serif, Georgia" font-size="18" font-weight="bold" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">
    राधे राधे
  </text>
  <text x="70" y="48" font-family="sans-serif" font-size="7" font-weight="600" fill="#FDE68A" text-anchor="middle" letter-spacing="2">
    SHRI RADHE
  </text>
</svg>
