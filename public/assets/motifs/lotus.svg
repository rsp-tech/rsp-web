<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="Divine Lotus">
  <defs>
    <linearGradient id="lotusGold" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="lotusPink" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Petals Left & Right -->
  <path d="M12 40C12 28 22 22 28 36C20 38 15 44 12 40Z" fill="url(#lotusPink)" opacity="0.85"/>
  <path d="M52 40C52 28 42 22 36 36C44 38 49 44 52 40Z" fill="url(#lotusPink)" opacity="0.85"/>
  <!-- Mid Petals -->
  <path d="M20 44C18 26 28 16 32 32C26 36 21 41 20 44Z" fill="url(#lotusGold)"/>
  <path d="M44 44C46 26 36 16 32 32C38 36 43 41 44 44Z" fill="url(#lotusGold)"/>
  <!-- Central Center Petal -->
  <path d="M32 10C26 22 26 38 32 46C38 38 38 22 32 10Z" fill="url(#lotusPink)" filter="url(#softGlow)"/>
  <path d="M32 16C28 24 28 36 32 42C36 36 36 24 32 16Z" fill="#FDE047" opacity="0.9"/>
  <!-- Base Calyx & Stem -->
  <path d="M24 48C28 52 36 52 40 48C42 51 38 55 32 55C26 55 22 51 24 48Z" fill="#10B981"/>
  <circle cx="32" cy="38" r="2.5" fill="#FEF08A"/>
</svg>
