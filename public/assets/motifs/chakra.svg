    <path d="M50 24 C48 16, 42 6, 50 2 C58 6, 52 16, 50 24 Z" transform="rotate(225 50 50)"/>
    <path d="M50 24 C48 16, 42 6, 50 2 C58 6, 52 16, 50 24 Z" transform="rotate(270 50 50)"/>
    <path d="M50 24 C48 16, 42 6, 50 2 C58 6, 52 16, 50 24 Z" transform="rotate(315 50 50)"/>
    
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(22.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(67.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(112.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(157.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(202.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(247.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(292.5 50 50)" fill="#FBBF24"/>
    <path d="M50 25 C49 19, 45 10, 50 6 C55 10, 51 19, 50 25 Z" transform="rotate(337.5 50 50)" fill="#FBBF24"/>
