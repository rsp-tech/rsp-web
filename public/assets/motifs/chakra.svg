<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="chakraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Central Hub -->
  <circle cx="50" cy="50" r="12" fill="url(#chakraGlow)" stroke="#78350F" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="6" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
  <circle cx="50" cy="50" r="2" fill="#78350F"/>
  
  <!-- Inner Ring with Jewels -->
  <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="50" cy="50" r="26" stroke="#B45309" stroke-width="1.5"/>

  <!-- Radiating Flames / Blades (16 Petals/Blades) -->
